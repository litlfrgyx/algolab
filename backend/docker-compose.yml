# Spustenie: docker compose -f backend/docker-compose.yml up --build   (z koreňa repozitára)
services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/algoanalyzer.db
    volumes:
      - ./data:/data
    # tvrdý strop pamäte a počtu procesov kontajnera, doplnok k setrlimit v sandboxe
    mem_limit: 1g
    pids_limit: 256
